<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>10 TKR 2 - PIT STOP V5</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9/dist/leaflet.js"></script>
<style>
:root{--orange:#FFA31A;--bg:#0e0e0e;--card:#18181b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Inter;font-weight:800}
.header{text-align:center;padding:12px;background:#000;border-bottom:3px solid #222}
.box{max-width:480px;margin:auto;padding:12px}.card{background:var(--card);border:1px solid #242424;border-radius:16px;padding:14px}
.gold{width:100%;padding:14px;border-radius:12px;border:0;background:var(--orange);color:#000;font-family:Orbitron;font-weight:900;cursor:pointer}
.lobby{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.btns{min-height:54px;padding:8px 10px;border-radius:10px;border:1px solid #333;background:#111;color:#ddd;font-size:11px;font-weight:800;text-align:left;line-height:1.15;cursor:pointer}
.btns.active{border-color:var(--orange);color:var(--orange);background:#1f1605}.btns.done{opacity:.35;pointer-events:none}
.pass-wrap{position:relative}.pass-wrap input{width:100%;padding:12px 45px 12px 12px;border-radius:10px;background:#000;border:1px solid #333;color:#fff;margin:6px 0}
.eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;background:#222;width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center}
#video{width:100%;border-radius:12px;background:#000;aspect-ratio:3/4;object-fit:cover;margin-top:8px}#map{height:170px;border-radius:12px;margin:8px 0;border:1px solid #222}
#gate{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
#popup{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:99;padding:20px}
</style></head><body>
<div id="gate"><div class="card" style="max-width:340px;text-align:center"><h2 style="font-family:Orbitron;color:var(--orange)">PIT STOP 10 TKR 2</h2><p style="color:#666;font-size:12px">Masukkan Password Kelas dulu Bos!</p><div class="pass-wrap"><input type="password" id="passKelas" placeholder="Password Kelas" value="" autocomplete="new-password"><div class="eye" id="eyeKelas">👁️</div></div><button class="gold" id="btnMasuk">GAS MASUK 🏁</button><small style="color:#555">Password default: tkr2jaya</small></div></div>
<div class="header"><div style="font-family:Orbitron;font-size:20px">10 TKR 2 <span style="background:var(--orange);color:#000;padding:2px 8px;border-radius:6px">PIT STOP</span></div><div id="clock" style="font-size:10px;color:#888;letter-spacing:2px;font-family:Orbitron"></div></div>
<div class="box"><div class="card"><div style="display:flex;justify-content:space-between"><b>LOBBY 36 PEMBALAP</b><small id="gpsText" style="color:var(--orange)">GPS...</small></div><div id="accText" style="font-size:10px;color:#666"></div><div id="lobby" class="lobby"></div>
<div id="panel" style="display:none;margin-top:14px;border-top:1px solid #222;padding-top:12px"><div id="selName" style="text-align:center;color:var(--orange)"></div><select id="ket" style="width:100%;padding:10px;border-radius:8px;background:#000;color:#fff;border:1px solid #333;margin:6px 0"><option value="H">H - HADIR GASPOL</option><option value="S">S - SAKIT</option><option value="I">I - IZIN</option><option value="D">D - DISPENSASI</option></select><video id="video" autoplay playsinline muted></video><canvas id="canvas" style="display:none"></canvas><div id="map"></div><input type="file" id="buktiFile" accept="image/*" style="display:none"><button class="gold" id="btnAbsen">📸 TAP ABSEN - SELFIE + GPS</button><div id="status" style="text-align:center;font-size:11px;color:#666"></div></div></div><a href="rekap.html" style="display:block;text-align:center;margin-top:12px;color:var(--orange);text-decoration:none;border:1px solid #333;padding:8px;border-radius:20px">📊 REKAP PRIBADI / GURU</a></div>
<div id="popup"><div class="card" style="max-width:340px;text-align:center"><div style="font-size:56px" id="popIcon">🏆</div><h2 id="popTitle" style="font-family:Orbitron;color:var(--orange)">VICTORY</h2><p id="popMsg" style="color:#aaa;font-size:13px"></p><button class="gold" onclick="document.getElementById('popup').style.display='none'">OKE BOSQUE</button></div></div>
<script>
const PASS_KELAS="tkr2jaya"; // GANTI PASSWORD KELAS DISINI BOS
const SUPABASE_URL="https://xozwsdjlifmoywmxdoaj.supabase.co";const SUPABASE_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhvenZzZGpsaWZtb3l3bXhkb2FqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc3MTEzNjgsImV4cCI6MjA3MzI4NzM2OH0.EkK2-9WkaC2u1oMTSR_C2v24a-LfR1pLEqRStJwRwR4";const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON);
const SEKOLAH={lat:-7.9891,lng:114.3952};const RADIUS=200;
const SISWA=["MUHAMMAD AMRUL FARUK","MUHAMMAD ARVIN ARGYA PRATAMA","MUHAMMAD DANIELL AMIN","MUHAMMAD FAISAL","MUHAMMAD IBRAHIM AZIZI","MUHAMMAD NAUFAL KIRAM","MUHAMMAD NAZRIEL FURQON","MUHAMMAD ROZAK KUMULLAH","MUHAMMAD SANDI PRATAMA","NIZAM ARJU HEAVENA HASIM","PUTRA ADITIA FIRMANSYAH","PUTRA ARIF OKTAVIANSYAH","RADDY ARDIANSYAH","RAFA ALFANDI DANISA PUTRA","RAFAEL SETYA NUR IMAN","RAMADIAN BARAKA MULYA","RIFKY ADITYA PRATAMA","RIKO ABDILLAH","RINO ADITIA PRATAMA","ROBI ANSA","SAIFUL BAHRI","SELIN FATHIR MAULANA","SEMI MAULANA YAHYA","SULTAN ATSAR WALHADITS","SURYA AJI WICAKSONO","SYAFIQ HIKAM AL BUKHORI","TAUFIQUUR RAHMAN ILHAM","TOLAK RAHMAT","TRIO RADIKA PUTRA","TRISNA ELLIA WIDHI WARDANA","VITO JULIO SAPUTRA","WIL DANUL FARUQ","WISNU AJI SASONGKO","YONGKI FIRMANSYAH","YUSUF AFANDI","ZAINUR ROHIQ FIRDIANO"];
let curPos=null,curAcc=9999,selected=null;const today=new Date().toISOString().slice(0,10);
function showPop(i,t,m){document.getElementById('popIcon').innerText=i;document.getElementById('popTitle').innerText=t;document.getElementById('popMsg').innerText=m;document.getElementById('popup').style.display='flex';}
// GATE PASSWORD KELAS - KOSONG + MATA
const pk=document.getElementById('passKelas'); pk.value=''; const ek=document.getElementById('eyeKelas');
ek.onclick=()=>{if(pk.type==='password'){pk.type='text';ek.innerText='🙈';}else{pk.type='password';ek.innerText='👁️';}};
document.getElementById('btnMasuk').onclick=()=>{if(pk.value!==PASS_KELAS) return showPop('🔒','PASSWORD SALAH','Tanya wali kelas Bos!'); document.getElementById('gate').style.display='none'; initGPS(); render();};
function render(){const lobby=document.getElementById('lobby');lobby.innerHTML='';SISWA.forEach((n,idx)=>{const done=localStorage.getItem(`absen_${today}_${n}`);const b=document.createElement('button');b.className='btns'+(done?' done':'');b.innerHTML=done?`${idx+1}. ${n}<br><span style="color:var(--orange);font-size:9px">DONE ${done}</span>`: `${idx+1}. ${n}`;b.onclick=()=>{if(done){showPop('⛔','SUDAH TEREKAM',`${n} jam ${done} hari ini. Lock 1x sehari!`);return;}document.querySelectorAll('.btns').forEach(x=>x.classList.remove('active'));b.classList.add('active');selected=n;document.getElementById('selName').innerText=(idx+1)+'. '+n;document.getElementById('panel').style.display='block';startCam();};lobby.appendChild(b);});}
function hitungJarak(a,b,c,d){const R=6371e3;const rad=x=>x*Math.PI/180;const dLat=rad(c-a),dLng=rad(d-b);const s=Math.sin(dLat/2)**2+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(s));}
function initGPS(){const map=L.map('map').setView([SEKOLAH.lat,SEKOLAH.lng],16);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);L.circle([SEKOLAH.lat,SEKOLAH.lng],{radius:RADIUS,color:'#FFA31A',fillOpacity:.15}).addTo(map);if(!navigator.geolocation)return;navigator.geolocation.watchPosition(p=>{curPos=p;curAcc=p.coords.accuracy;const dist=hitungJarak(p.coords.latitude,p.coords.longitude,SEKOLAH.lat,SEKOLAH.lng);document.getElementById('gpsText').innerText=`${Math.round(curAcc)}m | ${Math.round(dist)}m ${dist<=RADIUS?'✅':'❌'}`;document.getElementById('accText').innerText=curAcc<=30?'🟢 Akurasi TINGGI':curAcc<=60?'🟡 Akurasi SEDANG - ke jendela':'🔴 Akurasi RENDAH - Nyalakan High Accuracy';},e=>{},{enableHighAccuracy:true,maximumAge:0,timeout:15000});}
async function startCam(){try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});document.getElementById('video').srcObject=s;}catch(e){}}
document.getElementById('ket').addEventListener('change',e=>{document.getElementById('buktiFile').style.display=['S','I','D'].includes(e.target.value)?'block':'none';});
document.getElementById('btnAbsen').onclick=async()=>{if(!selected)return showPop('⚠️','PILIH NAMA','Tap nama dulu!');if(!curPos)return showPop('📡','GPS BELUM SIAP','Tunggu GPS!');if(curAcc>80)return showPop('🎯','AKURASI RENDAH',`${Math.round(curAcc)}m terlalu rendah!`);const dist=hitungJarak(curPos.coords.latitude,curPos.coords.longitude,SEKOLAH.lat,SEKOLAH.lng);if(dist>RADIUS)return showPop('📍','DILUAR SIRKUIT',`${Math.round(dist)}m dari sekolah!`);if(localStorage.getItem(`absen_${today}_${selected}`))return showPop('✅','SUDAH TEREKAM','Sudah absen hari ini!');const {data:cek}=await sb.from('absensi').select('id').eq('tanggal',today).eq('nama',selected).limit(1);if(cek&&cek.length>0){const jam=new Date().toLocaleTimeString('id-ID');localStorage.setItem(`absen_${today}_${selected}`,jam);return showPop('✅','SUDAH DI SERVER','Sudah masuk server!');}
document.getElementById('btnAbsen').disabled=true;document.getElementById('status').innerText='⏳ Uploading...';try{const video=document.getElementById('video');const canvas=document.getElementById('canvas');canvas.width=video.videoWidth;canvas.height=video.videoHeight;canvas.getContext('2d').drawImage(video,0,0);const blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',0.7));const fileName=`${today}/${selected}_${Date.now()}.jpg`;await sb.storage.from('selfie_tkr').upload(fileName,blob);const {data:urlData}=sb.storage.from('selfie_tkr').getPublicUrl(fileName);await sb.from('absensi').insert([{tanggal:today,nama:selected,keterangan:document.getElementById('ket').value,lat:curPos.coords.latitude,lng:curPos.coords.longitude,accuracy:Math.round(curAcc),foto_url:urlData.publicUrl}]);const jam=new Date().toLocaleTimeString('id-ID');localStorage.setItem(`absen_${today}_${selected}`,jam);showPop('🏆','LEGENDARY!',`${selected} jam ${jam} | ${Math.round(curAcc)}m`);render();}catch(err){showPop('❌','GAGAL',err.message);}document.getElementById('btnAbsen').disabled=false;document.getElementById('status').innerText='';};
setInterval(()=>{document.getElementById('clock').innerText=new Date().toLocaleTimeString('id-ID',{hour12:false})+' WIB';},1000);
</script></body></html>
