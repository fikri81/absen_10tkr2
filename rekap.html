<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>REKAP RACING 10 TKR 2</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>body{background:#0e0e11;color:#fff;font-family:Inter,sans-serif;padding:12px;margin:0}
h2{font-family:Orbitron;color:#FFD700;text-align:center;letter-spacing:2px}.card{background:#18181d;border:1px solid #222;border-radius:14px;padding:14px;margin:12px auto;max-width:700px}
table{width:100%;border-collapse:collapse;font-size:11px}th,td{border:1px solid #333;padding:6px;text-align:center}th{background:#222;color:#FFD700;font-family:Orbitron;font-size:9px}
select,button{padding:10px;background:#111;border:1px solid #333;color:#fff;border-radius:8px;font-family:Orbitron}button{background:#FFD700;color:#000;font-weight:900}
tr:hover{background:#222;cursor:pointer}
</style></head><body>
<h2>🏁 REKAP BULANAN 10 TKR 2</h2>
<div style="text-align:center"><select id="bulan"></select> <select id="tahun"></select> <button onclick="load()">LOAD PIT DATA</button> <a href="index.html" style="color:#FFD700;font-size:12px;margin-left:8px">← Kembali Absen</a></div>
<div class="card"><h3 style="font-family:Orbitron;font-size:12px;color:#888;text-align:center">TOTAL KELAS BULAN INI</h3><canvas id="chartKelas"></canvas></div>
<div class="card"><h3 style="font-family:Orbitron;font-size:12px;color:#888;text-align:center" id="judulSiswa">GRAFIK PER SISWA - Klik nama di tabel</h3><canvas id="chartSiswa"></canvas></div>
<div class="card" style="overflow:auto"><table id="tabel"><thead><tr><th style="text-align:left">NAMA PEMBALAP</th><th>H</th><th>T</th><th>S</th><th>I</th><th>D</th><th>A</th><th>%</th></tr></thead><tbody></tbody></table>
<p style="font-size:10px;color:#666;margin-top:8px">H=Hadir Tepat 05:30-07:30 | T=Telat 07:31-16:00 | S=Sakit | I=Izin | D=Dispensasi | A=Alpa (tidak absen sampai 16:00) | % = (H+T)/20 hari efektif</p>
</div>
<script>
const supa=supabase.createClient("https://xozwsdjlifmoywmxdoaj.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhvendzZGpsaWZtb3l3bXhkb2FqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxOTg1ODEsImV4cCI6MjEwNTc3NDU4MX0.8dtF7YpVlWGZ3OErpqAkPsBpcBPa0xQBs4NuC9cIPlY");
let bSel=document.getElementById('bulan'),tSel=document.getElementById('tahun');
for(let i=1;i<=12;i++)bSel.innerHTML+=`<option value="${i}" ${i===new Date().getMonth()+1?'selected':''}>Bulan ${i}</option>`;
for(let y=2024;y<=2027;y++)tSel.innerHTML+=`<option ${y===new Date().getFullYear()?'selected':''}>${y}</option>`;
let chartK,chartS;
async function load(){
 let b=bSel.value,y=tSel.value;
 let {data:siswa}=await supa.from('siswa').select('*').order('nama');
 let first=`${y}-${String(b).padStart(2,'0')}-01`; let lastY=b==12?Number(y)+1:y; let lastM=b==12?1:Number(b)+1; let last=`${lastY}-${String(lastM).padStart(2,'0')}-01`;
 let {data:abs}=await supa.from('absensi').select('*').gte('created_at',first).lt('created_at',last);
 let tbody=document.querySelector('#tabel tbody');tbody.innerHTML='';
 let totals={H:0,T:0,S:0,I:0,D:0,A:0};
 let per= ssw => {
  let list=abs.filter(a=>a.siswa_id===ssw.id);
  let c={H:list.filter(x=>x.status==='H').length,T:list.filter(x=>x.status==='T').length,S:list.filter(x=>x.status==='S').length,I:list.filter(x=>x.status==='I').length,D:list.filter(x=>x.status==='D').length};
  c.A=Math.max(0,20-(c.H+c.T+c.S+c.I+c.D)); return c;
 };
 let rows=siswa.map(sw=>{let c=per(sw); totals.H+=c.H;totals.T+=c.T;totals.S+=c.S;totals.I+=c.I;totals.D+=c.D;totals.A+=c.A; let pct=Math.round((c.H+c.T)/20*100); return {nama:sw.nama,...c,pct};});
 rows.forEach(r=>{tbody.innerHTML+=`<tr onclick="showSiswa('${r.nama}',${r.H},${r.T},${r.S},${r.I},${r.D},${r.A})"><td style="text-align:left">${r.nama}</td><td>${r.H}</td><td style="color:#ffcc00">${r.T}</td><td>${r.S}</td><td>${r.I}</td><td>${r.D}</td><td style="color:#ff4444">${r.A}</td><td>${r.pct}%</td></tr>`;});
 if(chartK)chartK.destroy();
 chartK=new Chart(document.getElementById('chartKelas'),{type:'doughnut',data:{labels:['Hadir OnTime','Telat','Sakit','Izin','Dispensasi','Alpa'],datasets:[{data:[totals.H,totals.T,totals.S,totals.I,totals.D,totals.A],backgroundColor:['#00ff88','#ffcc00','#ffaa00','#00aaff','#aa88ff','#ff4444'],borderWidth:0}]},options:{plugins:{title:{display:true,text:`Kelas 10 TKR 2 - ${b}/${y} - Total 36 anak`,color:'#FFD700'},legend:{labels:{color:'#fff'}}}}});
}
function showSiswa(nama,H,T,S,I,D,A){document.getElementById('judulSiswa').innerText=`GRAFIK: ${nama}`; if(chartS)chartS.destroy(); chartS=new Chart(document.getElementById('chartSiswa'),{type:'bar',data:{labels:['H','T','S','I','D','A'],datasets:[{label:nama,data:[H,T,S,I,D,A],backgroundColor:['#00ff88','#ffcc00','#ffaa00','#00aaff','#aa88ff','#ff4444']}]},options:{plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#fff'}},y:{beginAtZero:true,ticks:{color:'#fff'}}}}});}
load();
</script></body></html>
