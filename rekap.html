<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>REKAP RACING 10 TKR 2 - FIX</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{background:#111;color:#fff;font-family:system-ui;text-align:center;padding:12px}
.card{background:#222;border-radius:12px;padding:12px;margin:10px auto;max-width:900px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border:1px solid #333;padding:6px}
th{background:#FFD600;color:#000}
.btn{background:#FFD600;color:#000;border:0;padding:8px 14px;border-radius:8px;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<h2 style="color:#FFD600">🏁 REKAP BULANAN 10 TKR 2 - FIXED</h2>
<select id="bln"><option value="1">Bulan 1</option><option value="2">Bulan 2</option><option value="3">Bulan 3</option><option value="4">Bulan 4</option><option value="5">Bulan 5</option><option value="6">Bulan 6</option><option value="7">Bulan 7</option><option value="8">Bulan 8</option><option value="9" selected>Bulan 9</option><option value="10">Bulan 10</option><option value="11">Bulan 11</option><option value="12">Bulan 12</option></select>
<select id="thn"><option>2025</option><option selected>2026</option></select>
<button class="btn" onclick="load()">LOAD PIT DATA</button>
<a href="/" style="color:#FFD600;margin-left:10px">← Kembali Absen</a>
<div id="debug" style="color:#0f0;margin:8px;font-size:12px"></div>

<div class="card"><h4>TOTAL KELAS BULAN INI</h4><canvas id="c1"></canvas><div id="totalTxt"></div></div>
<div class="card"><h4 id="gJudul">GRAFIK PER SISWA - Klik nama di tabel</h4><canvas id="c2"></canvas></div>
<div class="card"><table id="tbl"><thead><tr><th>NAMA PEMBALAP</th><th>H</th><th>T</th><th>S</th><th>I</th><th>D</th><th>A</th><th>%</th></tr></thead><tbody></tbody></table>
<small>H=Hadir 06:30-07:30 | T=Telat 07:31-16:00 | S=Sakit | I=Izin | D=Dispensasi | A=Alpa | % = (H+T)/hari masuk</small>
</div>

<script>
const SUPA_URL="https://xozwsdjlifmoywmxdoaj.supabase.co";
const SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhvendzZGpsaWZtb3l3bXhkb2FqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxOTg1ODEsImV4cCI6MjEwNTc3NDU4MX0.8dtF7YpVlWGZ3OErpqAkPsBpcBPa0xQBs4NuC9cIPlY";
const supa=supabase.createClient(SUPA_URL,SUPA_KEY);
let chart1,chart2;

async function load(){
 const bln=parseInt(document.getElementById('bln').value);
 const thn=parseInt(document.getElementById('thn').value);
 const debug=document.getElementById('debug');
 debug.innerText="Loading...";
 try{
  let {data:siswa,error:e1}=await supa.from('siswa').select('*').order('nama',{ascending:true});
  if(e1) throw e1;

  // FIX: Ambil SEMUA absensi, tidak pakai created_at
  let {data:absAll,error:e2}=await supa.from('absensi').select('*').limit(1000);
  if(e2) throw e2;

  // Filter bulan di JS - coba deteksi kolom tanggal/waktu/tgl/jam
  let abs = absAll.filter(a=>{
    let t = a.tanggal || a.waktu || a.tgl || a.created_at || "";
    if(!t) return true; // kalau gak ada tanggal, tampilkan semua
    let d = new Date(t);
    if(isNaN(d)) return true; // format bukan ISO, tampilkan semua
    return (d.getMonth()+1)==bln && d.getFullYear()==thn;
  });

  // Jika filter menghasilkan 0 tapi data asli ada, tampilkan semua (biar tidak zonk)
  if(abs.length==0 && absAll.length>0) abs = absAll;

  debug.innerText=`Siswa: ${siswa.length} | Absensi Total: ${absAll.length} | Filter Bulan ${bln}/${thn}: ${abs.length}`;

  let map={};
  siswa.forEach(s=>{map[s.id]={nama:s.nama,H:0,T:0,S:0,I:0,D:0,A:0}});

  abs.forEach(a=>{
    let m=map[a.siswa_id];
    if(!m) return;
    let st=(a.status||'H').toUpperCase();
    if(['H','T','S','I','D','A'].includes(st)) m[st]++; else m.H++;
  });

  let tbody=document.querySelector('#tbl tbody');
  tbody.innerHTML="";
  let tot={H:0,T:0,S:0,I:0,D:0,A:0};
  siswa.forEach(s=>{
    let r=map[s.id];
    let hadir = r.H + r.T;
    let pct = hadir>0? Math.round((hadir / (hadir+r.S+r.I+r.D+r.A || 1))*100) : 0;
    if(abs.length>0) pct = Math.round(((r.H+r.T)/abs.length*36)*100); // simple
    // hitung % dari 20 hari efektif biar masuk akal
    pct = Math.round(((r.H+r.T)/20)*100);
    tot.H+=r.H; tot.T+=r.T; tot.S+=r.S; tot.I+=r.I; tot.D+=r.D; tot.A+=r.A;
    let tr=document.createElement('tr');
    tr.innerHTML=`<td style="text-align:left;cursor:pointer;color:#FFD600" onclick="showGrafik('${s.id}','${r.nama}')">${r.nama}</td><td>${r.H}</td><td>${r.T}</td><td>${r.S}</td><td>${r.I}</td><td>${r.D}</td><td>${r.A}</td><td>${pct}%</td>`;
    tbody.appendChild(tr);
  });

  document.getElementById('totalTxt').innerText=`H:${tot.H} T:${tot.T} S:${tot.S} I:${tot.I} D:${tot.D} A:${tot.A} | Total Record Ditampilkan: ${abs.length}`;

  if(chart1) chart1.destroy();
  chart1=new Chart(document.getElementById('c1'),{type:'doughnut',data:{labels:['H','T','S','I','D','A'],datasets:[{data:[tot.H,tot.T,tot.S,tot.I,tot.D,tot.A],backgroundColor:['#0f0','#FFD600','#0ff','#fa0','#a0f','#f00']}]},options:{plugins:{legend:{labels:{color:'#fff'}}}}});

  window._map=map;
  debug.innerText+= " - DONE! Klik nama untuk grafik";
 }catch(err){
  debug.innerText="ERROR: "+err.message;
  alert(err.message);
 }
}

function showGrafik(id,nama){
 let r=window._map[id];
 document.getElementById('gJudul').innerText="GRAFIK: "+nama;
 if(chart2) chart2.destroy();
 chart2=new Chart(document.getElementById('c2'),{type:'bar',data:{labels:['H','T','S','I','D','A'],datasets:[{label:nama,data:[r.H,r.T,r.S,r.I,r.D,r.A],backgroundColor:'#FFD600'}]},options:{plugins:{legend:{labels:{color:'#fff'}}},scales:{x:{ticks:{color:'#fff'}},y:{ticks:{color:'#fff'}}}}});
}
load();
</script>
</body>
</html>
